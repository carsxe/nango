carsxe:
    display_name: CarsXE
    categories:
        - other
    auth_mode: API_KEY
    proxy:
        base_url: https://api.carsxe.com
        query:
            key: ${apiKey}
        verification:
            method: GET
            endpoints:
                - /v1/auth/validate
    docs: https://nango.dev/docs/api-integrations/carsxe
    docs_connect: https://nango.dev/docs/api-integrations/carsxe/connect
    credentials:
        apiKey:
            type: string
            title: API Key
            description: Your CarsXE API key.
            doc_section: '#step-1-finding-your-api-key'
